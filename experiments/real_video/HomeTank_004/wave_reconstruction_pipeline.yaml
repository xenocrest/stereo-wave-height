schema_version: "1.0"
experiment: HomeTank_004
status: WAVE_DIAGNOSTIC_PIPELINE_CONFIG
input:
  left_video: videos/wave/wave_cam0_iQOO_Neo5S.mp4
  right_video: videos/wave/wave_cam1_iQOO_Z10_TurboPlus.mp4
  ffmpeg_executable: "${FFMPEG_EXE}"
  canonical_rotation_deg: {left: 180, right: 0}
  pairing_basis: timestamp
  synchronization_status: CANDIDATE_OFFSET_ZERO_CONFIDENCE_MEDIUM
  frame_pairs:
    - {frame_id: "000000", left_timestamp_s: 20.0, right_timestamp_s: 20.0, timestamp_ns: 20000000000}
    - {frame_id: "000001", left_timestamp_s: 20.1, right_timestamp_s: 20.1, timestamp_ns: 20100000000}
    - {frame_id: "000002", left_timestamp_s: 20.2, right_timestamp_s: 20.2, timestamp_ns: 20200000000}
    - {frame_id: "000003", left_timestamp_s: 20.3, right_timestamp_s: 20.3, timestamp_ns: 20300000000}
    - {frame_id: "000004", left_timestamp_s: 20.4, right_timestamp_s: 20.4, timestamp_ns: 20400000000}
calibration:
  file: calibration_result.yaml
  quality_mode: diagnostic_allow_failed_gate
  parameter_source: OPENCV_K0_D0_K1_D1_R_T_UNCHANGED
  manual_geometry_used_for_reconstruction: false
processing:
  run_type: wave
  stereo_backend: wass
  fixed_calibration: true
  run_autocalibrate: false
  wass_runtime_binding: "${WASS_RUNTIME_BINDING}"
  wass_config_dir: "${HOMETANK004_WASS_CONFIG_DIR}"
  reference_plane_file: static_reference_plane.yaml
  surface_distance_threshold_m: 0.010
  surface_distance_threshold_status: DIAGNOSTIC_OUTPUT_CLASSIFICATION_PARAMETER
output:
  directory: "${STEREO_WAVE_OUTPUT_DIR}"
validation_boundary:
  purpose: WAVE_PIPELINE_CLOSURE_WITH_STATIC_WARNING
  static_stability_status: FAIL_PRESERVED
  synchronization_status: CANDIDATE_ONLY
  industrial_accuracy: NOT_ESTABLISHED
