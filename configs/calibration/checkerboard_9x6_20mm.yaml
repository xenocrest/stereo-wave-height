schema_version: "1.0"
target:
  target_type: checkerboard
  pattern_cols: 9
  pattern_rows: 6
  expected_corner_count: 54
  physical_square_cols: 10
  physical_square_rows: 7
  square_size_m: 0.020
  source: HomeTank_003 planned target specification
  status: PLANNED

# Project heuristics for capture feedback; configurable, not universal standards.
preflight_thresholds:
  minimum_sharpness: 80.0
  minimum_coverage_fraction: 0.04
  maximum_coverage_fraction: 0.80
  minimum_edge_margin_px: 12.0
  maximum_perspective_score: 0.80
  duplicate_signature_distance: 0.12

dataset_thresholds:
  minimum_independent_poses: 12
  preferred_independent_poses: 20
  preferred_capture_range: [20, 30]
  candidate_sampling_interval_s: 0.5
  pairing_uses: [timestamp_proximity, pose_signature_distance]

quality_thresholds:
  maximum_mono_rms_px: 1.0
  maximum_stereo_rms_px: 1.5
  maximum_epipolar_rms_px: 1.0
  maximum_rectification_rms_px: 1.0
  note: initial project review defaults; override with documented experiment basis
