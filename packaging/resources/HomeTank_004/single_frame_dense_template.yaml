schema_version: '1.0'
input_mode: video_time
synchronization_source: HomeTank_004_frame_level_offset_model_with_R0_engineering_tolerance
input:
  left_video: USER_SELECTED
  right_video: USER_SELECTED
  target_time_s: 29.4654055
  canonical_rotation_deg: {left: 180, right: 0}
  ffmpeg_executable: ../../runtime/ffmpeg/ffmpeg.exe
synchronization:
  a: 1.0
  b_s: -0.0654055
  source: frame_level_synchronization.yaml wave offset model
  confidence: WARNING
  frame_level_established: false
  event_count: 5
  fit_residual_rmse_s: 0.008564146
  fit_residual_max_abs_s: 0.0139335
on_demand_sync_tolerance:
  status: ON_DEMAND_SYNC_TOLERANCE_ESTABLISHED
  strict_max_abs_frames: 0
  warning_max_abs_frames: 1
  evidence_source: sync_tolerance_validation.yaml
calibration:
  source: calibration_result.yaml
  quality_mode: diagnostic_allow_failed_gate
processing:
  wass_config_dir: wass_config
  wass_runtime_binding: ../../runtime/wass/runtime_binding.json
  reference_plane_file: static_reference_plane.yaml
  surface_distance_threshold_m: 0.01
dense_height:
  enabled: true
  mapping_file: manual_reference/frozen_cam1_validation_mapping.yaml
  water_roi: null  # The GUI requires an explicit canonical-cam1 selection.
  observation_gate_px: 2.0
  surface_completion:
    method: mls_quadratic
    max_gap_spacing_multiplier: 3.0
output:
  directory: USER_SESSION_OUTPUT
