orientation_rule:
  cam0: apply one metadata-derived 180-degree rotation during decoding
  cam1: preserve decoded pixel orientation
  source_mp4_modified: false
representative_frames:
  sampling: 10%, 50%, and 90% of each container duration
  storage: repository-external diagnostics only
  calibration_common_scene: PASS
  static_common_scene: PASS
  wave_common_scene: PASS
synchronization_preanalysis:
  method: global mean-luma at 10 Hz; five-sample smoothing and temporal-derivative cross-correlation within +/-5 s
  interpretation: candidate offsets only; not final frame synchronization
  calibration:
    candidate_cam1_minus_cam0_s: 0.0
    peak_correlation: 0.3190
    confidence: LOW
  static:
    candidate_cam1_minus_cam0_s: 0.1
    peak_correlation: 0.5352
    confidence: MEDIUM
  wave:
    candidate_cam1_minus_cam0_s: 0.0
